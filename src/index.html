<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Americas AWC Extractor</title>
<style>
  :root { --bg: #0f1117; --card: #181b24; --accent: #ff4fa3; --accent2: #5865f2; --text: #eef0f6; --muted: #8b92a8; }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 24px 24px 96px 24px; }
  .container { width: 90%; max-width: 1800px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: sticky; top: 0; z-index: 20; background: var(--bg, #0f1219);}
  h1 { margin: 0; font-size: 1.4rem; }
  .controls { display: flex; gap: 12px; align-items: center; }
  select, button { background: var(--card); color: var(--text); border: 1px solid #2d3244; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
  button.secondary { background: var(--accent2); border-color: var(--accent2); color: #fff; font-weight: 600; }
  button.danger { background: #ef4444; border-color: #ef4444; color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid #2d3244; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; user-select: none; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; margin: 0; }
  #dropzone { border: 2px dashed #343a4f; border-radius: 14px; padding: 48px 20px; text-align: center; background: var(--card); transition: 0.15s; cursor: pointer; margin-bottom: 20px; }
  #dropzone:hover { border-color: var(--accent); background: #211926; }
  #dropzone p { margin: 6px 0; color: var(--muted); }
  #globalDropOverlay { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; background: rgba(15, 17, 23, 0.88); backdrop-filter: blur(4px); pointer-events: none; }
  #globalDropOverlay.active { display: flex; }
  #globalDropOverlay .overlay-box { border: 3px dashed var(--accent); border-radius: 20px; padding: 60px 80px; text-align: center; background: #211926; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); }
  #status { margin-bottom: 16px; font-size: 0.95rem; color: #a5f3fc; }
  .group { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #262a38; scroll-margin-top: 56px; }
  .group-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; position: sticky; top: 56px; z-index: 18; background: var(--card); }
  .group-main { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
  .group-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .category-stats { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .category-stat { padding: 2px 6px; font-size: 0.7rem; }
  .awc-display-name { background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; font-size: 1rem; font-weight: 600; width: min(32vw, 420px); }
  .awc-display-name:hover, .awc-display-name:focus { border-color: #2d3244; outline: none; }
  .badge { background: #262b3d; padding: 3px 8px; border-radius: 6px; font-size: 0.8rem; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #232736; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  thead th { position: sticky; top: calc(56px + var(--group-header-height, 56px)); z-index: 15; background: var(--card); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th.sortable .arrow { font-size: 0.75rem; margin-left: 4px; color: var(--accent); }
  #groupNav { position: fixed; top: 80px; left: 8px; z-index: 30; display: flex; flex-direction: column; align-items: stretch; gap: 4px; width: fit-content; max-width: calc(100vw - 24px); max-height: calc(100vh - 168px); overflow-x: hidden; overflow-y: auto; padding: 5px; color: var(--muted); background: rgba(15, 17, 23, 0.96); border: 1px solid #2d3244; border-radius: 8px; }
  #groupNav[hidden] { display: none; }
  #groupNav span { padding: 2px; font-size: 0.68rem; font-weight: 600; }
  #groupNav a { display: block; min-width: 0; overflow: hidden; color: var(--text); background: var(--card); border: 1px solid #2d3244; border-radius: 6px; padding: 4px 5px; font-size: 0.7rem; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
  #groupNav a:hover, #groupNav a:focus { border-color: var(--accent); color: var(--accent); }
  body.has-group-nav .container { width: calc(100% - var(--group-nav-width) - 16px); margin-left: calc(var(--group-nav-width) - 4px); margin-right: 20px; }
  @media (max-width: 900px) {
    #groupNav { left: 4px; }
    body.has-group-nav .container { width: calc(100% - var(--group-nav-width) - 4px); margin-right: 8px; }
  }
  tr.playing-row { background: rgba(255, 79, 163, 0.12); }
  td.preview-col { width: 100%; }
  audio { height: 34px; width: 100%; min-width: 380px; display: block; }
  a.dl { color: var(--accent); text-decoration: none; font-weight: 600; }
  #playerBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9000; background: #141720; border-top: 1px solid #2d3244; padding: 12px 28px; display: flex; align-items: center; gap: 16px; box-shadow: 0 -8px 30px rgba(0,0,0,0.5); }
  #playerBar.hidden { display: none; }
  .pb-info { min-width: 210px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pb-title { font-weight: 600; font-size: 0.9rem; color: #fff; }
  .pb-sub { font-size: 0.78rem; color: var(--muted); }
  .pb-btns { display: flex; gap: 6px; align-items: center; }
  .pb-btns button { padding: 6px 11px; font-size: 0.95rem; }
  .pb-btns button.play-btn { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 40px; }
  #pbWaveWrap { flex: 1; height: 42px; position: relative; cursor: pointer; background: #0f1117; border: 1px solid #262b3d; border-radius: 8px; overflow: hidden; }
  #pbWave { width: 100%; height: 100%; display: block; }
  .pb-time { font-variant-numeric: tabular-nums; font-size: 0.85rem; color: var(--muted); min-width: 95px; text-align: right; }
  .tag-pills { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
  .tag-pill { padding: 2px 6px; font-size: 0.72rem; border-radius: 5px; transition: opacity 0.12s, box-shadow 0.12s, transform 0.12s; }
  .tag-pill, .category-stat { color: var(--category-color, #cbd5e1); background: var(--category-bg, #23283b); border: 1px solid var(--category-border, #323952); }
  .tag-pill:not(.active) { opacity: 0.5; }
  .tag-pill:not(.active):hover, .tag-pill:not(.active):focus { opacity: 0.85; }
  .tag-pill.active { background: var(--category-color, var(--accent)); border-color: var(--category-color, var(--accent)); color: #10131a; font-weight: 700; opacity: 1; box-shadow: 0 0 0 1px var(--category-color), 0 0 8px var(--category-color); transform: translateY(-1px); }
  .tag-color-intro { --category-color: #60a5fa; --category-bg: #172b45; --category-border: #315b91; }
  .tag-color-outro { --category-color: #c084fc; --category-bg: #30203d; --category-border: #6b3d89; }
  .tag-color-pad { --category-color: #2dd4bf; --category-bg: #123a38; --category-border: #23766e; }
  .tag-color-perc { --category-color: #fb923c; --category-bg: #3c2a1b; --category-border: #92521f; }
  .tag-color-lead { --category-color: #f472b6; --category-bg: #3d2031; --category-border: #914569; }
  .tag-color-bass { --category-color: #4ade80; --category-bg: #1c3628; --category-border: #38734e; }
  .tag-color-drums { --category-color: #f87171; --category-bg: #3d2020; --category-border: #914444; }
  .tag-color-synth { --category-color: #22d3ee; --category-bg: #15353c; --category-border: #2b7889; }
  .tag-color-other { --category-color: #cbd5e1; --category-bg: #282d3a; --category-border: #505b70; }
  .tag-color-calm { --category-color: #a5b4fc; --category-bg: #252641; --category-border: #565899; }
  #goTopBtn { position: fixed; right: 20px; bottom: 96px; z-index: 25; display: none; padding: 8px 12px; border-radius: 999px; cursor: pointer;}
  #goTopBtn.visible {display: inline-flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<div id="globalDropOverlay">
  <div class="overlay-box">
    <strong style="font-size:1.5rem; color:#fff;">Drop <code>.awc</code> files anywhere to extract</strong>
    <p style="color:var(--muted); margin:10px 0 0;">Release mouse button to start decoding</p>
  </div>
</div>
<button type="button" id="goTopBtn" class="secondary" title="Scroll to top">▲ Top</button>

<div class="container">
  <header>
    <h1>Project Americas <code>.awc</code> Audio Extractor</h1>
    <div class="controls">
      <label class="toggle" title="Play next bit automatically after labeling current bit"><input type="checkbox" id="autoPlayOnLabel" checked><span>Auto-Next on Label</span></label>
      <label class="toggle" title="Automatically re-sort by category when currently sorted by Category"><input type="checkbox" id="autoResortOnLabel" checked><span>Auto Re-Sort on Label</span></label>      <label for="fmt" style="color:var(--muted);font-size:0.9rem;">Format:</label>
      <select id="fmt">
        <option value="opus" selected>OPUS (Lossless Copy)</option>
        <option value="wav">WAV (PCM 16-bit)</option>
        <option value="ogg">OGG (Lossless Copy)</option>
        <option value="flac">FLAC (Lossless)</option>
      </select>
      <button id="zipAllBtn" class="secondary" disabled onclick="downloadAllZip()">Download All (.ZIP)</button>
      <button onclick="clearWorkspace()" class="danger" title="Remove everything from ./output folder?">Clear</button>
    </div>
  </header>

  <nav id="groupNav" aria-label="Open AWC tables" hidden></nav>

  <div id="dropzone" onclick="document.getElementById('fileInput').click()">
    <strong style="font-size:1.1rem;">Drag & Drop <code>.awc</code> files anywhere on this page</strong>
    <p>or click here to browse • Multi-core decoding • Output saved to <code>./output/</code></p>
    <input type="file" id="fileInput" accept=".awc" multiple hidden>
  </div>

  <div id="status"></div>
  <div id="results"></div>
</div>

<div id="playerBar" class="hidden">
  <div class="pb-info">
    <div class="pb-title" id="pbTitle">No track selected</div>
    <div class="pb-sub" id="pbSub">—</div>
  </div>
  <div class="pb-btns">
    <button onclick="stepTrack(-1)" title="Previous (Up Arrow)">⏮</button>
    <button class="play-btn" id="pbPlayBtn" onclick="toggleActivePlay()" title="Play/Pause (Space)">▶</button>
    <button onclick="stepTrack(1)" title="Next (Down Arrow)">⏭</button>
  </div>
  <div id="pbWaveWrap" title="Click or drag waveform to seek"><canvas id="pbWave"></canvas></div>
  <div class="pb-time" id="pbTime">0:00 / 0:00</div>
  <label class="toggle" title="Play next track automatically"><input type="checkbox" id="autoNext"><span>Auto-Next</span></label>
  <label class="toggle" title="Loop track with 3% crossfade"><input type="checkbox" id="loopFade"><span>Loop X-Fade</span></label>
</div>


<script src="/app.js"></script>
</body>
</html>
