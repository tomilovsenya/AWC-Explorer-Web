<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWC Explorer</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --bg: #0f1117; --card: #181b24; --accent: #ff4fa3; --accent2: #5865f2; --text: #eef0f6; --muted: #8b92a8; }
  * { box-sizing: border-box; font-family: 'GTAArtDeco', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 24px 24px 96px 24px; }
  .container { width: 90%; max-width: 1800px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: sticky; top: 0; z-index: 20; background: var(--bg, #0f1219);}
  h1 { margin: 0; font-size: 1.4rem; }
  .brand-logo { display: block; width: 160px; height: 40px; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
  .controls { display: flex; gap: 12px; align-items: center; }
  .format-control { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
  select, button { background: var(--card); color: var(--text); border: 1px solid #2d3244; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
  button.secondary { background: var(--accent2); border-color: var(--accent2); color: #fff; font-weight: 500; }
  button.danger { background: #ef4444; border-color: #ef4444; color: #fff; font-weight: 500; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid #2d3244; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; user-select: none; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; margin: 0; }
  #dropzone { border: 2px dashed #343a4f; border-radius: 14px; padding: 48px 20px; text-align: center; background: var(--card); transition: 0.15s; cursor: pointer; margin-bottom: 20px; }
  #dropzone:hover { border-color: var(--accent); background: #211926; }
  #dropzone p { margin: 6px 0; color: var(--muted); }
  #globalDropOverlay { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; background: rgba(15, 17, 23, 0.88); backdrop-filter: blur(4px); pointer-events: none; }
  #globalDropOverlay.active { display: flex; }
  #globalDropOverlay .overlay-box { border: 3px dashed var(--accent); border-radius: 20px; padding: 60px 80px; text-align: center; background: #211926; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); }
  #status { margin-bottom: 16px; font-size: 0.95rem; color: #a5f3fc; }
  .group { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #262a38; scroll-margin-top: 56px; }
  .group-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 6px; align-items: start; margin-bottom: 12px; position: sticky; top: 56px; z-index: 18; background: var(--card); }
  .group-main { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
  .group-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .group-actions { display: flex; gap: 8px; align-items: center; }
  .group-action-btn { display: inline-flex; flex: 0 0 38px; align-items: center; justify-content: center; width: 38px; height: 38px; padding: 8px; }
  .group-action-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .group-action-link { color: var(--accent); background: var(--card); border: 1px solid #2d3244; border-radius: 8px; text-decoration: none; }
  .group-action-link:hover, .group-action-link:focus { border-color: var(--accent); color: var(--accent); }
  .group-progress { grid-column: 1 / -1; display: flex; width: 100%; min-width: 0; height: 14px; overflow: hidden; border-radius: 999px; background: #262b3d; }
  .progress-segment { display: flex; flex: 0 0 auto; align-items: center; justify-content: center; min-width: 0; height: 100%; overflow: hidden; padding: 0 4px; color: #10131a; background: var(--category-color); font-size: 0.65rem; font-weight: 700; white-space: nowrap; border-right: 1px solid rgba(15, 17, 23, 0.5); }
  .progress-segment-label { white-space: nowrap; }
  .progress-unlabeled { background: #262b3d; color: #8b92a8; }
  .group-progress-labels { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 0.65rem; }
  .group-progress-labels[hidden] { display: none; }
  .progress-label { display: inline-flex; align-items: center; gap: 4px; color: var(--category-color); white-space: nowrap; }
  .progress-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--category-color); }
  .progress-label-unlabeled { --category-color: #8b92a8; }
  .group-progress, .group-progress-labels { user-select: none; -webkit-user-select: none; }
  .group-progress.category-sort-active .progress-segment { cursor: pointer; }
  .group-progress.category-sort-active .progress-segment:hover { filter: brightness(1.15); }
  .awc-display-name { background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; font-size: 1rem; font-weight: 500; width: min(32vw, 420px); }
  .awc-display-name:hover, .awc-display-name:focus { border-color: #2d3244; outline: none; }
  .badge { background: #262b3d; padding: 3px 8px; border-radius: 6px; font-size: 0.8rem; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #232736; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  .group th[data-sort="category"], .group td.category-cell,
  .group th:nth-child(3), .group td.group-cell { text-align: center; }
  .group td.category-cell .tag-pills, .group td.group-cell .subgroup-pills { justify-content: center; }
  thead th { position: sticky; top: calc(56px + var(--group-header-height, 56px)); z-index: 15; background: var(--card); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th.sortable .arrow { font-size: 0.75rem; margin-left: 4px; color: var(--accent); }
  #groupNav { position: fixed; top: 80px; left: 8px; z-index: 30; display: flex; flex-direction: column; align-items: stretch; gap: 4px; width: fit-content; max-width: calc(100vw - 24px); max-height: calc(100vh - 168px); overflow-x: hidden; overflow-y: auto; padding: 5px; color: var(--muted); background: rgba(15, 17, 23, 0.96); border: 1px solid #2d3244; border-radius: 8px; }
  #groupNav[hidden] { display: none; }
  #groupNav span { padding: 2px; font-size: 0.68rem; font-weight: 500; }
  #groupNav a { display: block; min-width: 0; overflow: hidden; color: var(--text); background: var(--card); border: 1px solid #2d3244; border-radius: 6px; padding: 4px 5px; font-size: 0.7rem; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
  #groupNav a:hover, #groupNav a:focus { border-color: var(--accent); color: var(--accent); }
  body.has-group-nav .container { width: calc(100% - var(--group-nav-width) - 16px); margin-left: calc(var(--group-nav-width) - 4px); margin-right: 20px; }
  @media (max-width: 900px) {
    #groupNav { left: 4px; }
    body.has-group-nav .container { width: calc(100% - var(--group-nav-width) - 4px); margin-right: 8px; }
  }
  @media (max-width: 1000px) {
    header { position: static; flex-wrap: wrap; gap: 8px; }
    .controls { flex: 1 1 100%; flex-wrap: wrap; justify-content: flex-start; gap: 6px; }
    .group-header { top: 0; }
    thead th { top: var(--group-header-height, 56px); }
  }
  tr.playing-row { background: rgba(255, 79, 163, 0.12); }
  td.preview-col { width: 100%; }
  audio { height: 34px; width: 100%; min-width: 380px; display: block; }
  a.dl { color: var(--accent); text-decoration: none; font-weight: 500; }
  .track-download { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid #2d3244; border-radius: 6px; background: var(--card); }
  .track-download svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .track-download:hover, .track-download:focus { border-color: var(--accent); }
  #playerBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9000; background: #141720; border-top: 1px solid #2d3244; padding: 12px 28px; display: flex; align-items: center; gap: 16px; box-shadow: 0 -8px 30px rgba(0,0,0,0.5); }
  #playerBar.hidden { display: none; }
  .pb-info { min-width: 210px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pb-title { font-weight: 500; font-size: 0.9rem; color: #fff; }
  .pb-sub { font-size: 0.78rem; color: var(--muted); }
  .pb-btns { display: flex; gap: 6px; align-items: center; }
  .pb-btns button { padding: 6px 11px; font-size: 0.95rem; }
  .pb-btns button.play-btn { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 40px; }
  #pbWaveWrap { flex: 1; height: 42px; position: relative; cursor: pointer; background: #0f1117; border: 1px solid #262b3d; border-radius: 8px; overflow: hidden; }
  #pbWave { width: 100%; height: 100%; display: block; }
  .pb-time { font-variant-numeric: tabular-nums; font-size: 0.85rem; color: var(--muted); min-width: 95px; text-align: right; }
  .tag-pills { display: flex; width: fit-content; max-width: 100%; justify-content: center; gap: 4px; margin: 0 auto; }
  .tag-pill { padding: 2px 6px; font-size: 0.72rem; border-radius: 5px; transition: opacity 0.12s, box-shadow 0.12s, transform 0.12s; }
  .tag-pill-compact { display: none; }
  .mobile-category-legend { display: none; }
  .mobile-sort-controls { display: none; }
  .mobile-category-legend-items { display: flex; flex-wrap: wrap; gap: 4px 8px; padding-top: 6px; }
  .mobile-category-key { display: inline-flex; align-items: center; gap: 4px; color: var(--category-color, var(--muted)); white-space: nowrap; }
  .mobile-category-key kbd { min-width: 18px; padding: 1px 3px; text-align: center; color: var(--text); background: var(--category-bg, #23283b); border: 1px solid var(--category-border, #323952); border-radius: 4px; }
  .mobile-cell-label { display: none; }
  .subgroup-pills { display: inline-flex; gap: 4px; }
  .subgroup-pills[hidden] { display: none; }
  .subgroup-pill { padding: 2px 6px; font-size: 0.72rem; border-radius: 5px; color: var(--muted); background: #23283b; border: 1px solid #323952; }
  .subgroup-pill:not(.active):not(:disabled) { opacity: 0.6; }
  .subgroup-pill.active { color: #fff; background: var(--accent2); border-color: var(--accent2); font-weight: 700; }
  .subgroup-pill:disabled { cursor: not-allowed; opacity: 0.25; }
  .subgroup-add-btn { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; color: var(--muted); background: transparent; border: 1px dashed #505b70; border-radius: 5px; }
  .subgroup-add-btn:hover, .subgroup-add-btn:focus { color: var(--text); border-color: var(--accent); }
  .tag-pill { color: var(--category-color, #cbd5e1); background: var(--category-bg, #23283b); border: 1px solid var(--category-border, #323952); }
  .tag-pill:not(.active) { opacity: 0.5; }
  .tag-pill:not(.active):hover, .tag-pill:not(.active):focus { opacity: 0.85; }
  .tag-pill.active { background: var(--category-color, var(--accent)); border-color: var(--category-color, var(--accent)); color: #10131a; font-weight: 700; opacity: 1; box-shadow: 0 0 0 1px var(--category-color), 0 0 8px var(--category-color); transform: translateY(-1px); }
  .tag-color-intro { --category-color: #60a5fa; --category-bg: #172b45; --category-border: #315b91; }
  .tag-color-outro { --category-color: #c084fc; --category-bg: #30203d; --category-border: #6b3d89; }
  .tag-color-pad { --category-color: #2dd4bf; --category-bg: #123a38; --category-border: #23766e; }
  .tag-color-perc { --category-color: #fb923c; --category-bg: #3c2a1b; --category-border: #92521f; }
  .tag-color-lead { --category-color: #f472b6; --category-bg: #3d2031; --category-border: #914569; }
  .tag-color-bass { --category-color: #4ade80; --category-bg: #1c3628; --category-border: #38734e; }
  .tag-color-drums { --category-color: #f87171; --category-bg: #3d2020; --category-border: #914444; }
  .tag-color-synth { --category-color: #22d3ee; --category-bg: #15353c; --category-border: #2b7889; }
  .tag-color-other { --category-color: #cbd5e1; --category-bg: #282d3a; --category-border: #505b70; }
  .tag-color-calm { --category-color: #a5b4fc; --category-bg: #252641; --category-border: #565899; }
  .tag-color-junk { --category-color: #fb7185; --category-bg: #3f1e2a; --category-border: #a43b55; }
  #goTopBtn { position: fixed; right: 20px; bottom: 96px; z-index: 25; display: none; padding: 8px 12px; border-radius: 999px; cursor: pointer;}
  #goTopBtn.visible {display: inline-flex; align-items: center; gap: 4px; }
  @media (min-width: 801px) {
    .group table { table-layout: auto; }
    .group td.track-name-cell { width: 1%; max-width: min(20vw, 320px); overflow: hidden; }
    .group td.track-name-cell .track-label { display: block; max-width: min(20vw, 320px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group td.file-cell { padding-right: 4px; padding-left: 4px; text-align: center; }
  }
  @media (min-width: 801px) and (max-width: 1600px) {
    .group th, .group td { padding: 6px 4px; }
    .group th { white-space: normal; }
  }
  @media (min-width: 801px) and (max-width: 1500px) {
    .mobile-category-legend { display: block; grid-column: 1 / -1; color: var(--muted); font-size: 0.72rem; }
    .mobile-category-legend summary { width: fit-content; cursor: pointer; }
    .tag-pills { flex-wrap: wrap; max-width: 100%; gap: 2px; margin: 0 auto; }
    .tag-pill { display: inline-flex; align-items: center; justify-content: center; width: 22px; min-width: 22px; height: 28px; padding: 0; }
    .tag-pill-full { display: none; }
    .tag-pill-compact { display: inline; }
    .subgroup-pills { gap: 2px; }
    .subgroup-pill { padding: 2px 3px; }
  }
  @media (max-width: 800px) {
    body { padding: 10px 8px 120px; }
    .container, body.has-group-nav .container { width: 100%; margin: 0 auto; }
    header { position: static; flex-direction: column; align-items: stretch; gap: 8px; margin-bottom: 12px; }
    .brand-logo { width: 132px; height: 33px; }
    .controls { flex-wrap: wrap; gap: 6px; }
    .controls .toggle { flex: 1 1 calc(50% - 4px); justify-content: center; min-width: 0; padding: 6px 7px; font-size: 0.75rem; }
    .controls select, .controls button { flex: 1 1 40%; min-width: 0; padding: 7px 8px; font-size: 0.78rem; }
    .controls .format-control { flex: 1 1 calc(50% - 4px); min-width: 0; justify-content: space-between; font-size: 0.78rem; }
    .controls .format-control select { flex: 1 1 0; }
    #dropzone { padding: 24px 12px; }
    #globalDropOverlay .overlay-box { margin: 12px; padding: 32px 18px; }
    #groupNav { top: auto; right: 8px; bottom: 122px; left: 8px; flex-direction: row; align-items: center; width: auto; max-width: none; max-height: 42px; overflow-x: auto; overflow-y: hidden; }
    #groupNav a { flex: 0 0 auto; max-width: 42vw; }
    #groupNav span { flex: 0 0 auto; }
    .group { padding: 8px; border-radius: 8px; }
    .group-header { top: 0; grid-template-columns: minmax(0, 1fr); column-gap: 6px; row-gap: 6px; margin-bottom: 8px; }
    .group-header > .group-actions { grid-column: 1; flex-wrap: nowrap; gap: 6px; }
    .group-header > .group-actions .group-action-btn { flex-basis: 36px; width: 36px; height: 36px; padding: 7px; }
    .awc-display-name { width: 100%; }
    .group-meta { gap: 4px; }
    .group-meta .badge { padding: 3px 6px; font-size: 0.68rem; }
    .mobile-category-legend { display: block; grid-column: 1 / -1; color: var(--muted); font-size: 0.72rem; }
    .mobile-category-legend summary { width: fit-content; cursor: pointer; }
    .mobile-sort-controls { display: flex; position: sticky; top: var(--group-header-height, 56px); z-index: 17; align-items: center; gap: 6px; margin-bottom: 4px; padding: 4px 0; background: var(--card); }
    .mobile-sort-controls label { color: var(--muted); font-size: 0.75rem; }
    .mobile-sort-controls select { flex: 1; min-width: 0; padding: 6px 8px; font-size: 0.78rem; }
    .mobile-sort-controls button { flex: 0 0 auto; padding: 6px 8px; font-size: 0.75rem; }
    .group table, .group tbody { display: block; width: 100%; }
    .group thead { display: none; }
    .group tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 6px 8px; padding: 8px 2px; border-bottom: 1px solid #232736; }
    .group tbody td { display: block; min-width: 0; padding: 0; border: 0; white-space: normal; }
    .group td.track-name-cell { grid-column: 1 / 3; grid-row: 1; overflow: hidden; }
    .group td.track-name-cell .track-label { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group td.group-cell { grid-column: 3; grid-row: 1; justify-self: end; }
    .group td.category-cell { grid-column: 1 / -1; grid-row: 2; }
    .group td.duration-cell { grid-column: 1; grid-row: 3; }
    .group td.size-cell { grid-column: 2; grid-row: 3; }
    .group td.file-cell { grid-column: 3; grid-row: 3; justify-self: end; }
    .mobile-cell-label { display: inline; color: var(--muted); }
    .tag-pills { flex-wrap: wrap; gap: 2px; margin: 0 auto; }
    .tag-pill { display: inline-flex; align-items: center; justify-content: center; width: 22px; min-width: 22px; height: 28px; padding: 0; font-size: 0.72rem; }
    .tag-pill-full { display: none; }
    .tag-pill-compact { display: inline; }
    .subgroup-pills { gap: 2px; }
    .subgroup-pill { width: 24px; height: 28px; padding: 0; }
    .subgroup-pills { max-width: 154px; flex-wrap: wrap; justify-content: flex-end; }
    #playerBar { flex-wrap: wrap; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
    .pb-info { flex: 1 1 auto; min-width: 0; max-width: none; }
    .pb-btns { flex: 0 0 auto; }
    #pbWaveWrap { order: 3; flex: 1 0 100%; height: 32px; }
    .pb-time { order: 4; flex: 1 1 auto; min-width: 0; font-size: 0.75rem; text-align: left; }
    #playerBar > .toggle { flex: 0 0 auto; padding: 5px 6px; font-size: 0.7rem; }
    #playerBar > .toggle input { width: 14px; height: 14px; }
    #goTopBtn { right: 10px; bottom: 120px; }
  }
</style>
</head>
<body>
<div id="globalDropOverlay">
  <div class="overlay-box">
    <strong style="font-size:1.5rem; color:#fff;">Drop <code>.awc</code> files anywhere to extract</strong>
    <p style="color:var(--muted); margin:10px 0 0;">Release mouse button to start decoding</p>
  </div>
</div>
<button type="button" id="goTopBtn" class="secondary" title="Scroll to top">▲ Top</button>

<div class="container">
  <header>
    <h1><img class="brand-logo" src="/logo.svg" alt="AWC Explorer" draggable="false"></h1>
    <div class="controls">
      <label class="toggle" title="Play next bit automatically after labeling current bit"><input type="checkbox" id="autoPlayOnLabel" checked><span>Auto-Next on Label</span></label>
      <label class="toggle" title="Automatically re-sort by category when currently sorted by Category"><input type="checkbox" id="autoResortOnLabel" checked><span>Auto Re-Sort on Label</span></label>
      <label class="format-control" title="Format used by Export All">
        <span>Export:</span>
        <select id="exportFmt">
          <option value="opus" selected>OPUS (copy when possible)</option>
          <option value="wav">WAV (PCM 16-bit)</option>
          <option value="ogg">OGG (copy when possible)</option>
          <option value="flac">FLAC (Lossless)</option>
        </select>
      </label>
      <button id="exportAllBtn" class="secondary" disabled onclick="exportAll()">Export All</button>
      <button onclick="clearWorkspace()" class="danger" title="Remove everything from ./output folder?">Clear</button>
    </div>
  </header>

  <nav id="groupNav" aria-label="Open AWC tables" hidden></nav>

  <div id="dropzone" onclick="document.getElementById('fileInput').click()">
    <strong style="font-size:1.1rem;">Drag & Drop <code>.awc</code> files anywhere on this page</strong>
    <p>or click here to browse • Multi-core decoding • Output saved to <code>./output/</code></p>
    <input type="file" id="fileInput" accept=".awc" multiple hidden>
  </div>

  <div id="status"></div>
  <div id="results"></div>
</div>

<div id="playerBar" class="hidden">
  <div class="pb-info">
    <div class="pb-title" id="pbTitle">No track selected</div>
    <div class="pb-sub" id="pbSub">—</div>
  </div>
  <div class="pb-btns">
    <button onclick="stepTrack(-1)" title="Previous (Up Arrow)">⏮</button>
    <button class="play-btn" id="pbPlayBtn" onclick="toggleActivePlay()" title="Play/Pause (Space)">▶</button>
    <button onclick="stepTrack(1)" title="Next (Down Arrow)">⏭</button>
  </div>
  <div id="pbWaveWrap" title="Click or drag waveform to seek"><canvas id="pbWave"></canvas></div>
  <div class="pb-time" id="pbTime">0:00 / 0:00</div>
  <label class="toggle" title="Play next track automatically"><input type="checkbox" id="autoNext"><span>Auto-Next</span></label>
  <label class="toggle" title="Loop track with 3% crossfade"><input type="checkbox" id="loopFade"><span>Loop X-Fade</span></label>
</div>


<script src="/app.js"></script>
</body>
</html>
